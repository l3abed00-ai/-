name: Android CI & Build APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python 3.11 & python-docx
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install python-docx for PythonToolkit unit tests
        run: pip install python-docx

      - name: Scan source files for leaked keys
        run: |
          if grep -rInE --exclude-dir=build --exclude-dir=.gradle "AIza|AQ\." app/src/ docs/; then
            echo "::error::Leaked API key pattern detected!"
            exit 1
          fi

      - name: Grant execute permission for gradlew and verify.sh
        run: chmod +x gradlew scripts/verify.sh

      - name: Run verification (tests, lint, and assembleDebug)
        run: ./scripts/verify.sh

      - name: Generate upload keystore for release build
        run: |
          keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "android" -keypass "android" -dname "CN=Jadhadha, OU=Education, O=L3abed, L=Rabat, C=MA"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"
        run: ./gradlew assembleRelease

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jadhadha-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Upload Verification & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
